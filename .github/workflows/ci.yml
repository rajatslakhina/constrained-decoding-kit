name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux · Swift 6.0 · build + test (warnings as errors)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

  macos:
    name: macOS 15 · build + test, and iOS Simulator build (incl. SwiftUI module)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Build (macOS)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test (macOS)
        run: swift test
      - name: Build for iOS Simulator (all products, incl. ConstrainedDecodingUI)
        run: |
          xcodebuild build \
            -scheme ConstrainedDecoding-Package \
            -destination 'generic/platform=iOS Simulator' \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
